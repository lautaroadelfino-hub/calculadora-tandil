# Corre los tests, el lint y la compilación en cada push y en cada pull request.
#
# No frena el despliegue por sí solo: Cloudflare Pages construye el sitio con
# `npm run build`, y ese comando corre los tests antes de `next build` (ver
# package.json), así que un push con la suite rota no llega a producción. Esta
# acción es la segunda red: deja el resultado a la vista en GitHub (la marca
# roja o verde al lado del commit) y, si en la cuenta de GitHub están
# prendidas las notificaciones de Actions, avisa por mail cuando falla.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # El id del proyecto es público (viaja en el HTML del sitio); sin él el
      # build imprime un aviso. La API key no hace falta para compilar.
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: liquidar-f01ab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Compilación
        run: npm run build:sin-tests
